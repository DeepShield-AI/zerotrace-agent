[package]
name = "zerotrace-agent"
version = "0.1.0"
edition = "2024"
default-run = "zerotrace-agent"

[workspace]
members = [
    "workspace-hack",
    "xtask",
    # ── New ZeroTrace crates ──
    "crates/zerotrace-core",
    "crates/zerotrace-kernel",
    "crates/zerotrace-kernel-derive",
    "crates/zerotrace-runtime",
    "crates/zerotrace-demo",
    "crates/zerotrace-config",
    "crates/zerotrace-forwarder",
    "crates/zerotrace-platform",
    "crates/zerotrace-debug",
    "crates/zerotrace-plugin-abi",
    # ── Plugin crates ──
    "crates/plugins/cloud_platform",
    "crates/plugins/grpc",
    "crates/plugins/http2",
    "crates/plugins/integration_skywalking",
    "crates/plugins/integration_vector",
    "crates/plugins/l7",
    "crates/plugins/npb_handler",
    "crates/plugins/npb_pcap_policy",
    "crates/plugins/npb_sender",
    "crates/plugins/packet_dedup",
    "crates/plugins/packet_segmentation_reassembly",
    "crates/plugins/packet_sequence_block",
    "crates/plugins/pcap_assembler",
    "crates/plugins/reorder",
    "crates/plugins/special_recv_engine",
    "crates/plugins/tunnel",
    # ── Legacy crates ──
    "crates/legacy/public",
    "crates/legacy/public-derive",
    "crates/legacy/public-derive-internals",
    "crates/legacy/trace-utils",
    "crates/legacy/enterprise-utils",
]
exclude = [
    "crates/plugins",
    "crates/legacy",
    "src/collectors/ebpf/legacy/samples/rust/profiler",
    "src/collectors/ebpf/legacy/samples/rust/socket-tracer",
]

[workspace.dependencies]
bitflags = "1.3"
cfg-if = "1.0"
k8s-openapi = { version = "0.24", features = ["v1_32", "schemars"] }
kube = { version = "0.98", default-features = false }
num_enum = "0.7"
prost = "0.12"
public = { path = "crates/legacy/public" }
public-derive = { path = "crates/legacy/public-derive" }
public-derive-internals = { path = "crates/legacy/public-derive-internals" }
regex = "1"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
socket2 = { version = "0.4", features = ["all"] }
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27"
async-trait = "0.1"
parking_lot = "0.12"
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
# why tonic 0.10:
# - tonic >= 0.11 uses tokio-rustls 0.25 that no longer allow disabling certificate verifier
# - tonic >= 0.12 uses hyper 1.0 which will break grpc tls code in EE version
# - tonic < 0.9 does not support setting message encoding/decoding buffer size
tonic = "0.10"
tonic-build = "0.10"

[dependencies]
ahash = "0.8"
anyhow = "1"
arc-swap = "1.5.0"
base64 = "0.21"
bincode = "=2.0.0-rc.3"
bitflags.workspace = true
bollard = "0.16"
bson = "2.7"
bytes = "1"
bytesize = "1.1.0"
cadence = "0.27.0"
cfg-if.workspace = true
chrono = "0.4"
clap = { version = "3.2.8", features = ["derive"] }
cloud_platform = { path = "crates/plugins/cloud_platform" }
dashmap = "5.3"
dns-lookup = "1.0"
elf = "0.4"
enterprise-utils = { path = "crates/legacy/enterprise-utils", optional = true }
enum_dispatch = "0.3"
envmnt = "0.10"
flate2 = "1"
flexi_logger = { version = "0.29", features = ["compress"] }
fs2 = "0.4"
futures = "0.3"
grpc = { path = "crates/plugins/grpc" }
hex = "0.4"
hostname = "0.3"
hpack = { git = "https://github.com/deepflowio/hpack-rs/" }
http = "0.2"
http2 = { path = "crates/plugins/http2" }
humantime = "2.1"
humantime-serde = "1.0"
hyper = { version = "0.14", features = ["full"] }
integration_skywalking = { path = "crates/plugins/integration_skywalking", optional = true }
integration_vector = { path = "crates/plugins/integration_vector", optional = true }
ipnet = "2"
ipnetwork = "0.18"
lazy_static = "1"
l7 = { path = "crates/plugins/l7" }
libc = "0.2"
log = "0.4"
lru = "0.9"
md-5 = "0.10"
nom = "7"
npb_handler = { path = "crates/plugins/npb_handler" }
npb_pcap_policy = { path = "crates/plugins/npb_pcap_policy" }
npb_sender = { path = "crates/plugins/npb_sender" }
num_enum.workspace = true
packet_dedup = { path = "crates/plugins/packet_dedup" }
packet_segmentation_reassembly = { path = "crates/plugins/packet_segmentation_reassembly" }
packet_sequence_block = { path = "crates/plugins/packet_sequence_block" }
page_size = "0.4.2"
parking_lot = "0.11"
pcap = "2.4"
pcap_assembler = { path = "crates/plugins/pcap_assembler" }
pcap-parser = { version = "0.17", optional = true }
pcap-sys = "0.1"
pnet = "^0.29"
prost.workspace = true
public.workspace = true
public-derive.workspace = true
public-derive-internals.workspace = true
rand = "0.8"
regex.workspace = true
ring = "0.17"
roxmltree = "0.14"
serde.workspace = true
serde_json = "1"
serde_yaml = "0.9"
signal-hook = "0.3"
simple-dns = "0.10"
socket2 = "0.4"
special_recv_engine = { path = "crates/plugins/special_recv_engine" }
strum.workspace = true
strum_macros.workspace = true
sysinfo = { version = "0.26", default-features = false }
thiserror = "1"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tonic.workspace = true
tunnel = { path = "crates/plugins/tunnel" }
uuid = "1"
wasmtime = "12.0.1"
wasmtime-wasi = "12.0.1"
zstd = "0.13"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
cgroups-rs = "0.2"
nix = "0.23"
procfs = { git = "https://github.com/deepflowio/procfs/" }
reorder = { path = "crates/plugins/reorder" }

[target.'cfg(target_os = "linux")'.dependencies]
k8s-openapi.workspace = true
kube = { workspace = true, features = [
    "client",
    "derive",
    "runtime",
    "rustls-tls",
] }
kube-derive = "0.98"
openshift-openapi = { version = "0.3", features = ["v4_5"] }
schemars = "0.8"
trace-utils = { path = "crates/legacy/trace-utils" }
zerotrace-forwarder = { path = "crates/zerotrace-forwarder" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.30", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[dev-dependencies]
criterion = { version = "0.3", features = ["html_reports"] }
env_logger = "0.11"
lru = "0.9"
tempfile = "3"
tokio-stream = "0.1"
uluru = "3.0.0"

[build-dependencies]
anyhow = "1"
chrono = "0.4"
dunce = "1"
tonic-build.workspace = true
walkdir = "2"

[features]
default = ["libtrace"]
enterprise = ["dep:enterprise-utils", "dep:pcap-parser"]
enterprise-integration = ["dep:integration_skywalking", "dep:integration_vector"]
extended_observability = ["libtrace"]
dylib_pcap = []
libtrace = []
test-utils = []

[[bench]]
name = "common"
harness = false

[[bench]]
name = "flow_generator"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "utils"
harness = false

[[bench]]
name = "lru"
harness = false

[[bench]]
name = "labeler"
harness = false

[[example]]
name = "parse_http_v1"
required-features = ["test-utils"]

[profile.release]
panic = 'abort'

[profile.dev]
panic = 'abort'
