msrv = "1.78.0"

# Override defaults that are too strict for an observability agent
# (a Source/Processor with 7-8 deps via DI is not a smell).
cognitive-complexity-threshold = 30
too-many-arguments-threshold   = 10
type-complexity-threshold      = 250

# Don't lint single-letter generics in trait impls (Bevy DI uses them everywhere).
single-char-binding-names-threshold = 5
